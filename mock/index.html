<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaiseTimeLine - プロトタイプ Mock</title>
  <style>
    :root {
      --blue: #1d9bf0;
      --blue-hover: #1a8cd8;
      --red: #f4212e;
      --red-hover: #d91f2b;
      --gray: #536471;
      --gray-light: #eff3f4;
      --gray-border: #cfd9de;
      --text: #0f1419;
      --white: #ffffff;
      --liked: #f91880;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7f9f9;
      color: var(--text);
      min-height: 100vh;
    }

    #app {
      max-width: 600px;
      margin: 0 auto;
      background: var(--white);
      min-height: 100vh;
      border-left: 1px solid var(--gray-border);
      border-right: 1px solid var(--gray-border);
    }

    /* ========== HEADER ========== */
    .header {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gray-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }
    .header-logo {
      font-weight: 800;
      font-size: 20px;
      color: var(--blue);
      cursor: pointer;
      letter-spacing: -0.5px;
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    /* ========== BUTTONS ========== */
    .btn {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn-primary { background: var(--blue); color: var(--white); }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--text); border: 1.5px solid var(--gray-border); }
    .btn-secondary:hover { background: var(--gray-light); }
    .btn-danger { background: var(--red); color: var(--white); }
    .btn-danger:hover { background: var(--red-hover); }
    .btn-dark { background: var(--text); color: var(--white); }
    .btn-dark:hover { background: #333; }
    .btn-outline-danger {
      background: transparent; color: var(--red);
      border: 1.5px solid var(--red);
    }
    .btn-outline-danger:hover { background: rgba(244,33,46,0.05); }

    .icon-btn {
      background: none; border: none; cursor: pointer;
      padding: 8px; border-radius: 50%;
      font-size: 18px; line-height: 1;
      transition: background 0.15s; color: var(--text);
    }
    .icon-btn:hover { background: var(--gray-light); }

    /* ========== USER MENU ========== */
    .user-menu-wrapper { position: relative; }
    .user-menu-btn {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; background: none; border: none;
      padding: 6px 10px; border-radius: 30px;
      transition: background 0.15s; font-family: inherit;
    }
    .user-menu-btn:hover { background: var(--gray-light); }
    .user-menu-name { font-size: 14px; font-weight: 600; }
    .user-menu-dropdown {
      position: absolute; top: calc(100% + 4px); right: 0;
      background: var(--white); border: 1px solid var(--gray-border);
      border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.12);
      min-width: 200px; z-index: 200; display: none;
    }
    .user-menu-dropdown.show { display: block; }
    .dropdown-item {
      padding: 14px 16px; font-size: 15px; cursor: pointer;
      transition: background 0.15s; display: block; width: 100%;
      text-align: left; background: none; border: none;
      font-family: inherit; color: var(--text);
    }
    .dropdown-item:hover { background: var(--gray-light); }
    .dropdown-item:first-child { border-radius: 12px 12px 0 0; }
    .dropdown-item:last-child { border-radius: 0 0 12px 12px; }
    .dropdown-item.danger { color: var(--red); }

    /* ========== AVATAR ========== */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      flex-shrink: 0; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 16px;
      color: white; cursor: pointer; overflow: hidden; object-fit: cover;
    }
    .avatar-lg { width: 64px; height: 64px; font-size: 24px; }
    .avatar-xl { width: 80px; height: 80px; font-size: 30px; }

    /* ========== AUTH ========== */
    .auth-container { padding: 48px 32px; }
    .auth-logo { font-size: 32px; font-weight: 800; color: var(--blue); margin-bottom: 8px; }
    .auth-title { font-size: 26px; font-weight: 700; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; color: var(--gray); margin-bottom: 4px; font-weight: 500; }
    .form-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--gray-border);
      border-radius: 8px; font-size: 16px; outline: none;
      transition: border-color 0.15s; font-family: inherit;
    }
    .form-input:focus { border-color: var(--blue); }
    .form-input:disabled { background: var(--gray-light); color: var(--gray); }
    .form-submit { width: 100%; padding: 14px; font-size: 16px; margin-top: 8px; border-radius: 30px; }
    .auth-link { text-align: center; margin-top: 18px; font-size: 14px; color: var(--gray); }
    .auth-link a { color: var(--blue); cursor: pointer; font-weight: 600; text-decoration: none; }
    .error-banner {
      background: rgba(244,33,46,0.08); color: var(--red);
      padding: 12px 14px; border-radius: 8px; font-size: 14px;
      margin-bottom: 16px; border: 1px solid rgba(244,33,46,0.2);
    }
    .demo-hint {
      margin-top: 24px; padding: 12px 14px;
      background: #f0f8ff; border-radius: 8px;
      font-size: 13px; color: var(--gray); line-height: 1.6;
      border: 1px solid #d0e8f8;
    }

    /* ========== TABS ========== */
    .tabs { display: flex; border-bottom: 1px solid var(--gray-border); }
    .tab {
      flex: 1; padding: 16px; text-align: center;
      font-size: 15px; font-weight: 600; cursor: pointer;
      color: var(--gray); border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--blue); }
    .tab:hover:not(.active) { background: var(--gray-light); }

    /* ========== POST CARD ========== */
    .post-card {
      padding: 14px 16px; border-bottom: 1px solid var(--gray-border);
      display: flex; gap: 12px; transition: background 0.15s;
    }
    .post-card:hover { background: #f9fafb; }
    .post-body { flex: 1; min-width: 0; }
    .post-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .post-username {
      font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .post-username:hover { text-decoration: underline; }
    .post-time { font-size: 13px; color: var(--gray); }
    .post-content {
      font-size: 15px; line-height: 1.55; margin-bottom: 10px;
      word-break: break-word; cursor: pointer;
      white-space: pre-wrap;
    }
    .post-image {
      width: 100%; max-height: 280px; object-fit: cover;
      border-radius: 12px; margin-bottom: 10px;
      border: 1px solid var(--gray-border); cursor: pointer;
    }
    .post-actions { display: flex; align-items: center; gap: 4px; }
    .action-btn {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; color: var(--gray); cursor: pointer;
      background: none; border: none; padding: 6px 10px;
      border-radius: 20px; transition: all 0.15s; font-family: inherit;
    }
    .action-btn:hover { background: rgba(29,155,240,0.08); color: var(--blue); }
    .action-btn.liked { color: var(--liked); }
    .action-btn.liked:hover { background: rgba(249,24,128,0.08); color: var(--liked); }
    .action-btn.delete-btn:hover { background: rgba(244,33,46,0.08); color: var(--red); }

    /* ========== POST DETAIL ========== */
    .page-header {
      padding: 10px 16px; display: flex; align-items: center;
      gap: 16px; border-bottom: 1px solid var(--gray-border);
      position: sticky; top: 0; background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px); z-index: 40;
    }
    .back-btn {
      background: none; border: none; cursor: pointer;
      font-size: 20px; color: var(--text); padding: 8px;
      border-radius: 50%; transition: background 0.15s; line-height: 1;
    }
    .back-btn:hover { background: var(--gray-light); }
    .page-title { font-size: 18px; font-weight: 700; }
    .page-sub { font-size: 13px; color: var(--gray); }

    .post-detail-body { padding: 16px; border-bottom: 1px solid var(--gray-border); }
    .post-detail-user { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .post-detail-name { font-weight: 700; font-size: 16px; cursor: pointer; }
    .post-detail-name:hover { text-decoration: underline; }
    .post-detail-text { font-size: 20px; line-height: 1.5; margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; }
    .post-detail-image { width: 100%; border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--gray-border); }
    .post-detail-time { font-size: 14px; color: var(--gray); padding-bottom: 12px; border-bottom: 1px solid var(--gray-border); }
    .post-detail-stats {
      display: flex; gap: 20px; padding: 12px 0;
      border-bottom: 1px solid var(--gray-border);
    }
    .stat-item { font-size: 15px; }
    .stat-count { font-weight: 700; }
    .post-detail-actions {
      display: flex; gap: 8px; padding: 6px 0;
    }

    /* ========== COMMENTS ========== */
    .comments-title {
      padding: 12px 16px; font-size: 15px; font-weight: 700;
      border-bottom: 1px solid var(--gray-border);
    }
    .comment-form {
      padding: 12px 16px; display: flex; gap: 12px;
      align-items: flex-start; border-bottom: 1px solid var(--gray-border);
    }
    .comment-input-wrapper { flex: 1; }
    .comment-input {
      width: 100%; border: 1.5px solid var(--gray-border);
      border-radius: 20px; padding: 10px 14px; font-size: 15px;
      outline: none; resize: none; font-family: inherit; min-height: 44px;
      transition: border-color 0.15s;
    }
    .comment-input:focus { border-color: var(--blue); }
    .comment-char-count { font-size: 12px; color: var(--gray); text-align: right; margin-top: 3px; }
    .comment-card {
      padding: 12px 16px; display: flex; gap: 12px;
      border-bottom: 1px solid var(--gray-border);
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .comment-username { font-weight: 700; font-size: 14px; cursor: pointer; }
    .comment-username:hover { text-decoration: underline; }
    .comment-time { font-size: 12px; color: var(--gray); }
    .comment-content { font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }

    /* ========== POST FORM ========== */
    .post-form-container { padding: 16px; }
    .post-textarea {
      width: 100%; border: 1.5px solid var(--gray-border);
      border-radius: 12px; padding: 14px 16px; font-size: 18px;
      line-height: 1.5; resize: none; outline: none;
      min-height: 160px; font-family: inherit;
      transition: border-color 0.15s;
    }
    .post-textarea:focus { border-color: var(--blue); }
    .char-count { text-align: right; font-size: 13px; color: var(--gray); margin-top: 6px; }
    .char-count.near-limit { color: #e8a000; }
    .char-count.over-limit { color: var(--red); font-weight: 700; }
    .image-upload-area { margin-top: 12px; }
    .image-preview { position: relative; margin-top: 10px; }
    .image-preview img {
      width: 100%; border-radius: 12px; max-height: 280px;
      object-fit: cover; border: 1px solid var(--gray-border);
    }
    .image-remove-btn {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.6); color: white; border: none;
      border-radius: 50%; width: 30px; height: 30px;
      cursor: pointer; font-size: 18px; display: flex;
      align-items: center; justify-content: center; line-height: 1;
    }
    .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 18px; }

    /* ========== SEARCH ========== */
    .search-container { padding: 16px; }
    .search-form { display: flex; gap: 8px; margin-top: 4px; }
    .search-input {
      flex: 1; padding: 11px 16px; border: 1.5px solid var(--gray-border);
      border-radius: 30px; font-size: 15px; outline: none; font-family: inherit;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--blue); }

    /* ========== USER CARD ========== */
    .user-card {
      padding: 12px 16px; display: flex; align-items: center;
      gap: 12px; border-bottom: 1px solid var(--gray-border);
      transition: background 0.15s;
    }
    .user-card:hover { background: var(--gray-light); }
    .user-card-info { flex: 1; min-width: 0; }
    .user-card-name { font-weight: 700; font-size: 15px; }
    .user-card-bio {
      font-size: 13px; color: var(--gray); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ========== PROFILE ========== */
    .profile-section { padding: 16px; border-bottom: 1px solid var(--gray-border); }
    .profile-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .profile-username { font-size: 22px; font-weight: 700; margin-top: 10px; }
    .profile-bio { font-size: 15px; line-height: 1.5; color: var(--text); margin-top: 8px; }
    .profile-stats { display: flex; gap: 20px; margin-top: 12px; }
    .profile-stat { font-size: 14px; cursor: pointer; color: var(--gray); }
    .profile-stat:hover { color: var(--text); }
    .profile-stat:hover .profile-stat-count { text-decoration: underline; }
    .profile-stat-count { font-weight: 700; color: var(--text); }

    /* ========== PROFILE EDIT ========== */
    .profile-edit-container { padding: 16px; }
    .avatar-edit-area {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; margin-bottom: 24px; padding: 16px;
      border: 1.5px dashed var(--gray-border); border-radius: 12px;
    }
    .avatar-edit-btn {
      font-size: 14px; color: var(--blue); cursor: pointer;
      background: none; border: none; font-weight: 700; font-family: inherit;
    }
    .bio-textarea {
      width: 100%; border: 1.5px solid var(--gray-border);
      border-radius: 8px; padding: 12px 14px; font-size: 16px;
      outline: none; resize: none; min-height: 90px; font-family: inherit;
      transition: border-color 0.15s;
    }
    .bio-textarea:focus { border-color: var(--blue); }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      padding: 60px 32px; text-align: center; color: var(--gray);
    }
    .empty-state-icon { font-size: 52px; margin-bottom: 14px; }
    .empty-state-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .empty-state-desc { font-size: 15px; line-height: 1.5; }

    /* ========== LOAD MORE ========== */
    .load-more-btn {
      width: 100%; padding: 16px; text-align: center;
      font-size: 15px; color: var(--blue); background: none;
      border: none; border-bottom: 1px solid var(--gray-border);
      cursor: pointer; font-weight: 700; font-family: inherit;
      transition: background 0.15s;
    }
    .load-more-btn:hover { background: var(--gray-light); }

    /* ========== NO LOGIN BANNER ========== */
    .no-login-banner {
      padding: 14px 16px; background: var(--gray-light);
      text-align: center; font-size: 14px; color: var(--gray);
      border-bottom: 1px solid var(--gray-border);
    }
    .no-login-banner a { color: var(--blue); cursor: pointer; font-weight: 700; }

    /* ========== DIALOG ========== */
    .dialog-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45); display: flex;
      align-items: center; justify-content: center; z-index: 1000;
    }
    .dialog-overlay.hidden { display: none; }
    .dialog-box {
      background: var(--white); border-radius: 16px; padding: 28px 24px;
      max-width: 360px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .dialog-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .dialog-desc { font-size: 15px; color: var(--gray); margin-bottom: 24px; line-height: 1.5; }
    .dialog-actions { display: flex; flex-direction: column; gap: 10px; }
    .dialog-btn { width: 100%; padding: 14px; border-radius: 30px; font-size: 16px; }

    /* ========== TOAST ========== */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%); background: #333;
      color: var(--white); padding: 12px 24px;
      border-radius: 20px; font-size: 14px; font-weight: 600;
      z-index: 2000; opacity: 0; transition: opacity 0.25s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ========== MUTUAL BADGE ========== */
    .mutual-badge {
      font-size: 11px; color: var(--gray); background: var(--gray-light);
      padding: 2px 6px; border-radius: 4px; margin-left: 4px;
    }

    .section-divider {
      height: 8px; background: var(--gray-light);
      border-top: 1px solid var(--gray-border);
      border-bottom: 1px solid var(--gray-border);
    }
  </style>
</head>

  // ============================================================
  // UTILITIES
  // ============================================================
  function formatDate(date) {
    const diff = Date.now() - date;
    const s = Math.floor(diff / 1000);
    if (s < 60)  return s + '秒前';
    const m = Math.floor(s / 60);
    if (m < 60)  return m + '分前';
    const h = Math.floor(m / 60);
    if (h < 24)  return h + '時間前';
    const d = Math.floor(h / 24);
    if (d < 7)   return d + '日前';
    return date.toLocaleDateString('ja-JP');
  }

  function formatDateFull(date) {
    return date.toLocaleString('ja-JP', {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  }

  function getUser(id) { return state.users.find(u => u.id === id); }

  function getLikeCount(postId)    { return state.likes.filter(l => l.postId === postId).length; }
  function getCommentCount(postId) { return state.comments.filter(c => c.postId === postId).length; }

  function isLiked(postId) {
    return !!state.currentUser &&
      state.likes.some(l => l.postId === postId && l.userId === state.currentUser.id);
  }

  function isFollowing(targetId) {
    return !!state.currentUser &&
      state.follows.some(f => f.followerId === state.currentUser.id && f.followingId === targetId);
  }

  function isMutual(targetId) {
    return isFollowing(targetId) &&
      state.follows.some(f => f.followerId === targetId && f.followingId === state.currentUser.id);
  }

  function getFollowerCount(userId)  { return state.follows.filter(f => f.followingId === userId).length; }
  function getFollowingCount(userId) { return state.follows.filter(f => f.followerId === userId).length; }

  function getFollowers(userId) {
    return state.follows.filter(f => f.followingId === userId).map(f => getUser(f.followerId)).filter(Boolean);
  }
  function getFollowing(userId) {
    return state.follows.filter(f => f.followerId === userId).map(f => getUser(f.followingId)).filter(Boolean);
  }

  function genId() { return 'id' + Date.now() + Math.random().toString(36).slice(2,7); }

  function esc(s) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(String(s)));
    return d.innerHTML;
  }

  function avatarHtml(user, cls = '') {
    const color = getAvatarColor(user.id);

    if (user.avatarData) {
      return `<img src="${user.avatarData}" class="avatar ${cls}" style="object-fit:cover" onclick="event.stopPropagation();navigateUser('${user.id}')">`;
    }
    return `<div class="avatar ${cls}" style="background:${color}" onclick="event.stopPropagation();navigateUser('${user.id}')">${initial}</div>`;
  }

  let _toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), 2600);

  function showDialog({ title, desc, confirmLabel, confirmClass, onConfirm }) {
    document.getElementById('dialog-title').textContent = title;
    document.getElementById('dialog-desc').textContent = desc;
    const btn = document.getElementById('dialog-confirm-btn');
    btn.textContent = confirmLabel || '削除する';
    btn.className = `btn ${confirmClass || 'btn-danger'} dialog-btn`;
    btn.onclick = () => { hideDialog(); onConfirm(); };
    document.getElementById('dialog-overlay').classList.remove('hidden');
  }

  function hideDialog() {
    document.getElementById('dialog-overlay').classList.add('hidden');
  }

  function navigate(hash) { window.location.hash = hash; }

  function render() {
    const hash = window.location.hash || '#/';

    // Close dropdown
    const dd = document.getElementById('user-menu');
    if (dd) dd.classList.remove('show');

    const routes = [
      [/^#\/?$/,                          () => renderTimeline()],
      [/^#\/login$/,                      () => renderLogin()],
      [/^#\/register$/,                   () => renderRegister()],
      [/^#\/posts\/new$/,                 () => renderPostNew()],
      [/^#\/posts\/(.+)$/,                m  => renderPostDetail(m[1])],
      [/^#\/search$/,                     () => renderSearch()],
      [/^#\/users\/(.+)\/followers$/,     m  => renderUserList(m[1], 'followers')],
      [/^#\/users\/(.+)\/following$/,     m  => renderUserList(m[1], 'following')],
      [/^#\/users\/(.+)$/,                m  => renderUserProfile(m[1])],
      [/^#\/profile$/,                    () => renderProfileEdit()],
    ];

    for (const [pat, fn] of routes) {
      const m = hash.match(pat);
      if (m) { fn(m); return; }
    }
    renderTimeline();
  }

  function postCardHtml(post) {
    const user = getUser(post.userId);
    if (!user) return '';
    const liked   = isLiked(post.id);
    const likes   = getLikeCount(post.id);
    const comments = getCommentCount(post.id);
    const isOwner = state.currentUser && state.currentUser.id === post.userId;

    return `
      <div class="post-card">
        ${avatarHtml(user)}
        <div class="post-body">
          <div class="post-header">
            <span class="post-username" onclick="event.stopPropagation();navigateUser('${user.id}')">${esc(user.username)}</span>
            <span class="post-time">· ${formatDate(post.createdAt)}</span>
          </div>
          <div class="post-content" onclick="navigate('#/posts/${post.id}')">${esc(post.content)}</div>
          ${post.imageData ? `<img src="${post.imageData}" class="post-image" onclick="navigate('#/posts/${post.id}')">` : ''}
          <div class="post-actions" onclick="event.stopPropagation()">
            <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
              ${liked ? '❤️' : '🤍'} ${likes}
            </button>
            <button class="action-btn" onclick="navigate('#/posts/${post.id}')">
              💬 ${comments}
            </button>
            ${isOwner ? `<button class="action-btn delete-btn" onclick="confirmDeletePost('${post.id}', false)">🗑️ 削除</button>` : ''}
          </div>
        </div>
      </div>`;
  }

  function doRegister() {
    const name  = document.getElementById('r-name').value.trim();
    const email = document.getElementById('r-email').value.trim();
    const pass  = document.getElementById('r-pass').value;
    const pass2 = document.getElementById('r-pass2').value;
    const errEl = document.getElementById('auth-error');

    const errs = [];
    if (!name)                     errs.push('ユーザー名は必須です');
    else if (name.length > 50)     errs.push('ユーザー名は50文字以内で入力してください');

    if (!email)                    errs.push('メールアドレスは必須です');
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
                                   errs.push('有効なメールアドレスを入力してください');
    else if (state.users.some(u => u.email === email))
                                   errs.push('このメールアドレスはすでに登録されています');

    if (!pass)                     errs.push('パスワードは必須です');
    else if (pass.length < 8)      errs.push('パスワードは8文字以上で入力してください');

    if (pass !== pass2)            errs.push('パスワードが一致しません');

    if (errs.length) {
      errEl.innerHTML = `<div class="error-banner">${errs.map(esc).join('<br>')}</div>`;
      return;
    }

    const newUser = { id: genId(), username: name, email, password: pass, bio: '', avatarData: null };
    state.users.push(newUser);
    state.currentUser = newUser;
    showToast('アカウントを作成しました！');
    navigate('#/');
  }

  // ============================================================
  // S-03: TIMELINE
  // ============================================================
  const PAGE_SIZE = 20;

  function renderTimeline() {
    let posts = [...state.posts].sort((a, b) => b.createdAt - a.createdAt);

    if (state.currentUser && state.timelineTab === 'home') {
      const followingIds = new Set(
        state.follows.filter(f => f.followerId === state.currentUser.id).map(f => f.followingId)
      );
      followingIds.add(state.currentUser.id);
      posts = posts.filter(p => followingIds.has(p.userId));
    }

    const visible = posts.slice(0, state.timelinePage * PAGE_SIZE);
    const hasMore = visible.length < posts.length;

    document.getElementById('app').innerHTML = `
      ${headerHtml()}
      ${state.currentUser ? `
        <div class="tabs">
          <div class="tab ${state.timelineTab === 'home' ? 'active' : ''}" onclick="switchTab('home')">ホーム</div>
          <div class="tab ${state.timelineTab === 'all'  ? 'active' : ''}" onclick="switchTab('all')">すべて</div>
        </div>` : ''}
      <div>
        ${visible.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-icon">🐦</div>
            <div class="empty-state-title">投稿がありません</div>
            <div class="empty-state-desc">${state.timelineTab === 'home'
              ? 'フォローしているユーザーの投稿がここに表示されます' : 'まだ投稿がありません'}</div>
          </div>` : visible.map(postCardHtml).join('')}
      </div>
      ${hasMore ? `<button class="load-more-btn" onclick="loadMore()">もっと見る</button>` : ''}`;
  }

  function switchTab(tab) {
    state.timelineTab = tab;
    state.timelinePage = 1;
    renderTimeline();
  }

  function loadMore() {
    state.timelinePage++;
    renderTimeline();
  }

  function onPostInput() {

  function onImageSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const errEl = document.getElementById('post-form-error');
    if (file.size > 5 * 1024 * 1024) {
      errEl.innerHTML = '<div class="error-banner">画像は5MB以下のファイルを選択してください</div>';
      e.target.value = '';
      return;
    }
    if (!['image/jpeg','image/png','image/gif'].includes(file.type)) {
      errEl.innerHTML = '<div class="error-banner">jpg / png / gif 形式のみ対応しています</div>';
      e.target.value = '';
      return;
    }
    errEl.innerHTML = '';
    const reader = new FileReader();
    reader.onload = ev => {
      _postImageData = ev.target.result;
      document.getElementById('img-preview').innerHTML = `
        <div class="image-preview">
          <img src="${_postImageData}">
          <button class="image-remove-btn" onclick="removePostImage()">×</button>
        </div>`;
    };
    reader.readAsDataURL(file);
  }

  function removePostImage() {
    _postImageData = null;
    document.getElementById('img-preview').innerHTML = '';
    document.getElementById('img-input').value = '';
  }

  function doPost() {
    const content = document.getElementById('post-text').value.trim();
    if (!content) return;
    state.posts.unshift({
      id: genId(), userId: state.currentUser.id,
      content, imageData: _postImageData, createdAt: new Date(),
    });
    _postImageData = null;
    state.timelinePage = 1;
    state.timelineTab = 'all';
    showToast('投稿しました！');
    navigate('#/');
  }

  // ============================================================
  // S-05: POST DETAIL
  // ============================================================
  function renderPostDetail(postId) {
    const post = state.posts.find(p => p.id === postId);
    if (!post) { navigate('#/'); return; }

    const user     = getUser(post.userId);
    const liked    = isLiked(post.id);
    const likes    = getLikeCount(post.id);
    const isOwner  = state.currentUser && state.currentUser.id === post.userId;
    const comments = state.comments.filter(c => c.postId === postId)
                       .sort((a, b) => b.createdAt - a.createdAt);

    document.getElementById('app').innerHTML = `
      ${headerHtml()}
      <div class="page-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <span class="page-title">投稿</span>
      </div>
      <div class="post-detail-body">
        <div class="post-detail-user">
          ${avatarHtml(user)}
          <div>
            <div class="post-detail-name" onclick="navigateUser('${user.id}')">${esc(user.username)}</div>
          </div>
          ${isOwner ? `
            <button class="action-btn delete-btn" style="margin-left:auto"
              onclick="confirmDeletePost('${post.id}', true)">🗑️ 削除</button>` : ''}
        </div>
        <div class="post-detail-text">${esc(post.content)}</div>
        ${post.imageData ? `<img src="${post.imageData}" class="post-detail-image">` : ''}
        <div class="post-detail-time">${formatDateFull(post.createdAt)}</div>
        <div class="post-detail-stats">
          <div class="stat-item"><span class="stat-count">${likes}</span> いいね</div>
          <div class="stat-item"><span class="stat-count">${comments.length}</span> コメント</div>
        </div>
        <div class="post-detail-actions">
          <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${post.id}', true)">
            ${liked ? '❤️ いいね済み' : '🤍 いいね'}
          </button>
        </div>
      </div>
      <div>
        <div class="comments-title">コメント（${comments.length}件）</div>
        ${state.currentUser ? `
          <div class="comment-form">
            ${avatarHtml(state.currentUser)}
            <div class="comment-input-wrapper">
              <textarea id="comment-input" class="comment-input"
                placeholder="コメントを入力...（200文字以内）"
                rows="2" maxlength="200"
                oninput="onCommentInput()"></textarea>
              <div class="comment-char-count" id="comment-char">0 / 200 文字</div>
            </div>
            <button class="btn btn-primary" style="align-self:flex-end;padding:8px 14px"
              onclick="doComment('${postId}')">投稿</button>
          </div>` : `
          <div class="no-login-banner">
            コメントするには <a onclick="navigate('#/login')">ログイン</a> してください
          </div>`}
        ${comments.map(c => {
          const cu = getUser(c.userId);
          if (!cu) return '';
          const isCOwner = state.currentUser && state.currentUser.id === c.userId;
          return `
            <div class="comment-card">
              ${avatarHtml(cu)}
              <div class="comment-body">
                <div class="comment-header">
                  <div>
                    <span class="comment-username" onclick="navigateUser('${cu.id}')">${esc(cu.username)}</span>
                    <span class="comment-time" style="margin-left:6px">${formatDate(c.createdAt)}</span>
                  </div>
                  ${isCOwner ? `<button class="action-btn delete-btn" onclick="confirmDeleteComment('${c.id}','${postId}')">🗑️</button>` : ''}
                </div>
                <div class="comment-content">${esc(c.content)}</div>
              </div>
            </div>`;
        }).join('')}
      </div>`;
  }

  function onCommentInput() {
    const len = document.getElementById('comment-input').value.length;
    document.getElementById('comment-char').textContent = `${len} / 200 文字`;
  }

  function doComment(postId) {
    const el      = document.getElementById('comment-input');
    const content = el.value.trim();
    if (!content || content.length > 200) { showToast('コメントは1〜200文字で入力してください'); return; }
    state.comments.push({ id: genId(), postId, userId: state.currentUser.id, content, createdAt: new Date() });
    showToast('コメントしました');
    renderPostDetail(postId);
  }

  // ============================================================
  // S-06: SEARCH
  // ============================================================
  function renderSearch() {
    if (!state.currentUser) { navigate('#/login'); return; }

    document.getElementById('app').innerHTML = `
      ${headerHtml()}
      <div class="page-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <span class="page-title">ユーザー検索</span>
      </div>
      <div class="search-container">
        <div class="search-form">
          <input id="search-q" type="text" class="search-input" placeholder="ユーザー名を入力..."
            onkeydown="if(event.key==='Enter')doSearch()">
          <button class="btn btn-primary" onclick="doSearch()">検索</button>
        </div>
        <div id="search-results"></div>
      </div>`;
  }

  function doSearch() {
    const q = document.getElementById('search-q').value.trim();
    if (!q) return;
    const results = state.users.filter(u => u.id !== state.currentUser.id && u.username.includes(q));
    const el = document.getElementById('search-results');
    if (results.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-desc">ユーザーが見つかりませんでした</div></div>';
      return;
    }
    el.innerHTML = results.map(u => userCardHtml(u, 'search')).join('');
  }

  // ============================================================
  // USER CARD (共通)
  // ============================================================
  function userCardHtml(u, context = '') {
    const following = isFollowing(u.id);
    const isSelf    = state.currentUser && state.currentUser.id === u.id;
    const mutual    = isSelf ? false : (following && isMutual(u.id));
    return `
      <div class="user-card" onclick="navigateUser('${u.id}')">
        ${avatarHtml(u)}
        <div class="user-card-info">
          <div class="user-card-name">
            ${esc(u.username)}
            ${mutual ? '<span class="mutual-badge">相互フォロー</span>' : ''}
          </div>
          <div class="user-card-bio">${esc(u.bio || '自己紹介なし')}</div>
        </div>
        ${state.currentUser && !isSelf ? `
          <button class="btn ${following ? 'btn-outline-danger' : 'btn-dark'}"
            style="flex-shrink:0;padding:6px 14px;font-size:13px"
            onclick="event.stopPropagation();toggleFollow('${u.id}','${context}')">
            ${following ? 'フォロー中' : 'フォロー'}
          </button>` : ''}
      </div>`;
  }

  // ============================================================
  // S-07: USER PROFILE
  // ============================================================
  function renderUserProfile(userId) {
    const user = getUser(userId);
    if (!user) { navigate('#/'); return; }

    const isSelf     = state.currentUser && state.currentUser.id === userId;
    const following  = isFollowing(userId);
    const mutual     = !isSelf && following && isMutual(userId);
    const followers  = getFollowerCount(userId);
    const following_ = getFollowingCount(userId);
    const userPosts  = state.posts.filter(p => p.userId === userId)
                          .sort((a, b) => b.createdAt - a.createdAt);

    document.getElementById('app').innerHTML = `
      ${headerHtml()}
      <div class="page-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <div>
          <div class="page-title">${esc(user.username)}</div>
          <div class="page-sub">${userPosts.length}件の投稿</div>
        </div>
      </div>
      <div class="profile-section">
        <div class="profile-top">
          ${avatarHtml(user, 'avatar-xl')}
          <div style="margin-top:4px">
            ${isSelf ? `
              <button class="btn btn-secondary" onclick="navigate('#/profile')">編集</button>` :
            state.currentUser ? `
              <button class="btn ${following ? 'btn-outline-danger' : 'btn-dark'}"
                onclick="toggleFollow('${userId}','profile')">
                ${following ? 'フォロー中' : 'フォロー'}
              </button>` : ''}
          </div>
        </div>
        <div class="profile-username">
          ${esc(user.username)}
          ${mutual ? '<span class="mutual-badge">相互フォロー</span>' : ''}
        </div>
        ${user.bio ? `<div class="profile-bio">${esc(user.bio)}</div>` : ''}
        <div class="profile-stats">
          <div class="profile-stat" onclick="navigate('#/users/${userId}/following')">
            <span class="profile-stat-count">${following_}</span> フォロー中
          </div>
          <div class="profile-stat" onclick="navigate('#/users/${userId}/followers')">
            <span class="profile-stat-count">${followers}</span> フォロワー
          </div>
        </div>
      </div>
      <div>
        ${userPosts.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div class="empty-state-title">投稿がありません</div>
          </div>` : userPosts.map(postCardHtml).join('')}
      </div>`;
  }

  // ============================================================
  // S-08: PROFILE EDIT
  // ============================================================
  function renderProfileEdit() {
    if (!state.currentUser) { navigate('#/login'); return; }
    const u = state.currentUser;

    document.getElementById('app').innerHTML = `
      ${headerHtml()}
      <div class="page-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <span class="page-title">プロフィール編集</span>
      </div>
      <div class="profile-edit-container">
        <div class="avatar-edit-area">
          ${avatarHtml(u, 'avatar-xl')}
          <input type="file" id="avatar-input" accept="image/*" style="display:none"
            onchange="onAvatarSelect(event)">
          <button class="avatar-edit-btn" onclick="document.getElementById('avatar-input').click()">
            📷 画像を変更
          </button>
        </div>
        <div id="profile-edit-error"></div>
        <div class="form-group">
          <label class="form-label">ユーザー名（1〜50文字）</label>
          <input id="e-name" type="text" class="form-input" value="${esc(u.username)}" maxlength="50">
        </div>
        <div class="form-group">
          <label class="form-label">自己紹介（0〜160文字）</label>
          <textarea id="e-bio" class="bio-textarea" maxlength="160"
            oninput="onBioInput()">${esc(u.bio || '')}</textarea>
          <div class="char-count" id="bio-char">${(u.bio||'').length} / 160 文字</div>
        </div>
        <div class="form-group">
          <label class="form-label">メールアドレス（変更不可）</label>
          <input type="email" class="form-input" value="${esc(u.email)}" disabled>
        </div>
        <div class="form-actions">
          <button class="btn btn-secondary" onclick="history.back()">キャンセル</button>
          <button class="btn btn-primary" onclick="doProfileSave()">保存する</button>
        </div>
      </div>`;
  }

  function onBioInput() {
    const len = document.getElementById('e-bio').value.length;
    const el  = document.getElementById('bio-char');
    el.textContent = `${len} / 160 文字`;
    el.className = 'char-count' + (len >= 160 ? ' over-limit' : len >= 140 ? ' near-limit' : '');
  }

  function onAvatarSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('画像は5MB以下を選択してください'); return; }
    const reader = new FileReader();
    reader.onload = ev => {
      state.currentUser.avatarData = ev.target.result;
      const idx = state.users.findIndex(u => u.id === state.currentUser.id);
      if (idx !== -1) state.users[idx].avatarData = ev.target.result;
      renderProfileEdit();
    };
    reader.readAsDataURL(file);
  }

  function doProfileSave() {
    const name = document.getElementById('e-name').value.trim();
    const bio  = document.getElementById('e-bio').value;
    const errEl = document.getElementById('profile-edit-error');

    const errs = [];
    if (!name)             errs.push('ユーザー名は必須です');
    else if (name.length > 50) errs.push('ユーザー名は50文字以内で入力してください');
    if (bio.length > 160)  errs.push('自己紹介は160文字以内で入力してください');

    if (errs.length) {
      errEl.innerHTML = `<div class="error-banner">${errs.map(esc).join('<br>')}</div>`;
      return;
    }

    state.currentUser.username = name;
    state.currentUser.bio = bio;
    const idx = state.users.findIndex(u => u.id === state.currentUser.id);
    if (idx !== -1) { state.users[idx].username = name; state.users[idx].bio = bio; }

    showToast('プロフィールを保存しました');
    navigate(`#/users/${state.currentUser.id}`);
  }

  // ============================================================
  // S-09 / S-10: FOLLOWER / FOLLOWING LIST
  // ============================================================
  function renderUserList(userId, type) {
    const user = getUser(userId);
    if (!user) { navigate('#/'); return; }

    const isFollowers = type === 'followers';
    const title = isFollowers ? 'フォロワー' : 'フォロー中';
    const users = isFollowers ? getFollowers(userId) : getFollowing(userId);

    document.getElementById('app').innerHTML = `
      ${headerHtml()}
      <div class="page-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <div>
          <div class="page-title">${esc(user.username)}</div>
          <div class="page-sub">${title}</div>
        </div>
      </div>
      <div>
        ${users.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-icon">👥</div>
            <div class="empty-state-title">${title}はいません</div>
          </div>` : users.map(u => userCardHtmlForList(u, userId, type)).join('')}
      </div>`;
  }

  function userCardHtmlForList(u, profileUserId, type) {
    const following = isFollowing(u.id);
    const isSelf    = state.currentUser && state.currentUser.id === u.id;
    const mutual    = !isSelf && following && isMutual(u.id);
    return `
      <div class="user-card" onclick="navigateUser('${u.id}')">
        ${avatarHtml(u)}
        <div class="user-card-info">
          <div class="user-card-name">
            ${esc(u.username)}
            ${mutual ? '<span class="mutual-badge">相互フォロー</span>' : ''}
          </div>
          <div class="user-card-bio">${esc(u.bio || '自己紹介なし')}</div>
        </div>
        ${state.currentUser && !isSelf ? `
          <button class="btn ${following ? 'btn-outline-danger' : 'btn-dark'}"
            style="flex-shrink:0;padding:6px 14px;font-size:13px"
            onclick="event.stopPropagation();toggleFollowInList('${u.id}','${profileUserId}','${type}')">
            ${following ? 'フォロー中' : 'フォロー'}
          </button>` : ''}
      </div>`;
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  function toggleLike(postId, isDetail = false) {
    if (!state.currentUser) { navigate('#/login'); return; }
    const idx = state.likes.findIndex(l => l.postId === postId && l.userId === state.currentUser.id);
    if (idx !== -1) state.likes.splice(idx, 1);
    else            state.likes.push({ userId: state.currentUser.id, postId });
    isDetail ? renderPostDetail(postId) : render();
  }

  function toggleFollow(targetId, context = '') {
    if (!state.currentUser) { navigate('#/login'); return; }
    const idx = state.follows.findIndex(f =>
      f.followerId === state.currentUser.id && f.followingId === targetId);

    if (idx !== -1) {
      const target = getUser(targetId);
      showDialog({
        title: 'フォローを解除しますか？',
        desc: `${target.username}さんへのフォローを解除します。`,
        confirmLabel: 'フォロー解除',
        confirmClass: 'btn-danger',
        onConfirm: () => {
          state.follows.splice(idx, 1);
          showToast('フォローを解除しました');
          if (context === 'profile') renderUserProfile(targetId);
          else render();
        },
      });
    } else {
      state.follows.push({ followerId: state.currentUser.id, followingId: targetId });
      showToast('フォローしました');
      if (context === 'profile') renderUserProfile(targetId);
      else render();
    }
  }

  function toggleFollowInList(targetId, profileUserId, type) {
    if (!state.currentUser) { navigate('#/login'); return; }
    const idx = state.follows.findIndex(f =>
      f.followerId === state.currentUser.id && f.followingId === targetId);

    if (idx !== -1) {
      const target = getUser(targetId);
      showDialog({
        title: 'フォローを解除しますか？',
        desc: `${target.username}さんへのフォローを解除します。`,
        confirmLabel: 'フォロー解除',
        confirmClass: 'btn-danger',
        onConfirm: () => {
          state.follows.splice(idx, 1);
          showToast('フォローを解除しました');
          renderUserList(profileUserId, type);
        },
      });
    } else {
      state.follows.push({ followerId: state.currentUser.id, followingId: targetId });
      showToast('フォローしました');
      renderUserList(profileUserId, type);
    }
  }

  function confirmDeletePost(postId, isDetail = false) {
    showDialog({
      title: '投稿を削除しますか？',
      desc: 'この投稿を削除すると元に戻せません。',
      confirmLabel: '削除する',
      confirmClass: 'btn-danger',
      onConfirm: () => {
        const idx = state.posts.findIndex(p => p.id === postId);
        if (idx !== -1) state.posts.splice(idx, 1);
        state.comments = state.comments.filter(c => c.postId !== postId);
        state.likes    = state.likes.filter(l => l.postId !== postId);
        showToast('投稿を削除しました');
        isDetail ? navigate('#/') : render();
      },
    });
  }

  function confirmDeleteComment(commentId, postId) {
    showDialog({
      title: 'コメントを削除しますか？',
      desc: 'このコメントを削除すると元に戻せません。',
      confirmLabel: '削除する',
      confirmClass: 'btn-danger',
      onConfirm: () => {
        const idx = state.comments.findIndex(c => c.id === commentId);
        if (idx !== -1) state.comments.splice(idx, 1);
        showToast('コメントを削除しました');
        renderPostDetail(postId);
      },
    });
  }

  function doLogout() {
    state.currentUser = null;
    state.timelineTab = 'all';
    state.timelinePage = 1;
    showToast('ログアウトしました');
    navigate('#/login');
  }

  // ============================================================
  // BOOT
  // ============================================================
  render();
  </script>
</body>
</html>
